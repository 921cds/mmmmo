<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Mockup Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Montserrat:wght@400;600;800&family=DM+Serif+Display&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&family=Playfair+Display:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="viewport" class="tool-move" aria-label="캔버스">
    <div id="world"></div>
    <div id="overlay"></div>
    <div id="marquee"></div>
  </main>

  <!-- Left: brand kit + layers -->
  <aside id="left" class="panel">
    <header class="panel-header">
      <span class="app-mark" data-icon="mockup"></span>
      <input id="board-title" class="title-input" spellcheck="false" aria-label="보드 이름">
      <button id="menu-btn" class="icon-btn" data-icon="dots" title="메뉴"></button>
    </header>
    <nav class="tabs">
      <button class="tab active" data-tab="brand">브랜드</button>
      <button class="tab" data-tab="layers">레이어 <span id="layer-count" class="count"></span></button>
    </nav>

    <div class="panel-body" data-pane="brand">
      <section class="section">
        <div class="section-head">
          <span class="section-title">로고</span>
          <button id="logo-remove" class="link-btn" hidden>제거</button>
        </div>
        <div id="logo-drop" class="logo-drop" tabindex="0" role="button" aria-label="로고 업로드">
          <img id="logo-preview" alt="" hidden>
          <div class="logo-empty">
            <span data-icon="upload"></span>
            <strong>로고 파일을 끌어다 놓기</strong>
            <span>또는 클릭해서 선택 · SVG, PNG, JPG</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head"><span class="section-title">브랜드</span></div>
        <div class="field-group">
          <label class="label" for="brand-name">이름</label>
          <input id="brand-name" class="field" spellcheck="false">
        </div>
        <div class="field-group">
          <label class="label" for="brand-tagline">슬로건</label>
          <input id="brand-tagline" class="field" spellcheck="false">
        </div>
      </section>

      <section class="section">
        <div class="section-head"><span class="section-title">컬러</span></div>
        <div class="color-row">
          <label class="color-chip"><input type="color" id="brand-primary" aria-label="Primary 색상"></label>
          <input id="brand-primary-hex" class="hex" spellcheck="false" maxlength="7">
          <span class="tag">Primary</span>
        </div>
        <div class="color-row">
          <label class="color-chip"><input type="color" id="brand-secondary" aria-label="Secondary 색상"></label>
          <input id="brand-secondary-hex" class="hex" spellcheck="false" maxlength="7">
          <span class="tag">Secondary</span>
        </div>
      </section>

      <section class="section">
        <div class="section-head"><span class="section-title">타이포그래피</span></div>
        <select id="brand-font" class="field"></select>
      </section>

      <section class="section">
        <button id="generate-all" class="btn btn-primary">목업 전체 생성</button>
        <p class="hint">현재 브랜드로 12종 목업을 캔버스 오른쪽에 배치합니다.</p>
      </section>
    </div>

    <div class="panel-body" data-pane="layers" hidden>
      <ul id="layers" class="layers"></ul>
    </div>
  </aside>

  <!-- Right: design properties -->
  <aside id="right" class="panel">
    <header class="panel-header">
      <span class="panel-title">디자인</span>
      <div class="zoom">
        <button class="icon-btn" data-zoom="out" data-icon="minus" title="축소  ⌘−"></button>
        <button id="zoom-value" data-zoom="fit" title="전체 보기  ⇧1">100%</button>
        <button class="icon-btn" data-zoom="in" data-icon="plus" title="확대  ⌘+"></button>
      </div>
    </header>
    <div id="props" class="panel-body"></div>
  </aside>

  <!-- Bottom toolbar -->
  <div id="toolbar" class="panel" role="toolbar">
    <button class="tool active" data-tool="move" data-icon="move" data-tip="이동  V"></button>
    <button class="tool" data-tool="hand" data-icon="hand" data-tip="손 도구  H"></button>
    <span class="tool-sep"></span>
    <button class="tool" data-tool="note" data-icon="note" data-tip="노트  N"></button>
    <button class="tool" id="tool-image" data-icon="image" data-tip="이미지  I"></button>
    <button class="tool" id="tool-mockup" data-icon="mockup" data-tip="목업  M"></button>
  </div>

  <div id="mockup-menu" class="popover" hidden></div>

  <div id="file-menu" class="dropdown" hidden>
    <button data-cmd="new">새 보드</button>
    <button data-cmd="save">보드 파일로 저장 <span>.json</span></button>
    <button data-cmd="open">보드 파일 열기</button>
    <hr>
    <button data-cmd="image">이미지 추가 <span>I</span></button>
    <button data-cmd="fit">전체 보기 <span>⇧1</span></button>
  </div>

  <div id="toast" role="status"></div>

  <datalist id="fs-list">
    <option value="10"><option value="12"><option value="14"><option value="16"><option value="20"><option value="24">
    <option value="32"><option value="40"><option value="48"><option value="64"><option value="96"><option value="128">
  </datalist>

  <input type="file" id="file-image" accept="image/*" multiple hidden>
  <input type="file" id="file-logo" accept="image/*" hidden>
  <input type="file" id="file-el-image" accept="image/*" hidden>
  <input type="file" id="file-board" accept="application/json,.json" hidden>

  <script src="mockups.js"></script>
  <script src="app.js"></script>
</body>
</html>
